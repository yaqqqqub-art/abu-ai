<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABU AI CLOUD — Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#050b16;
    --bg-panel:#0c1830;
    --bg-panel-2:#101f3d;
    --line:#1c2f52;
    --ink:#e9eefb;
    --ink-dim:#8fa1c4;
    --accent:#2fd4e8;
    --accent-2:#3a7bd5;
    --accent-soft:rgba(47,212,232,0.12);
    --bubble-user:#173a63;
    --bubble-ai:#0f1c36;
    --danger:#ff6b6b;
    --radius:16px;
    --font-ui:'Inter','Noto Sans Bengali',sans-serif;
    --font-display:'Space Grotesk','Noto Sans Bengali',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--font-ui);
    background:
      radial-gradient(1100px 600px at 15% -10%, rgba(58,123,213,0.25), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(47,212,232,0.14), transparent 55%),
      var(--bg-deep);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  body[data-lang="bn"]{ font-family:'Noto Sans Bengali','Inter',sans-serif; }
  body[data-lang="bn"] .brand-name, body[data-lang="bn"] .brand-tag{ font-family:'Noto Sans Bengali','Space Grotesk',sans-serif; }

  /* ---------- HEADER ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:14px 22px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(16,31,61,0.85), rgba(16,31,61,0.55));
    backdrop-filter:blur(10px);
    position:sticky;
    top:0;
    z-index:20;
  }
  .brand{ display:flex; align-items:center; gap:12px; min-width:0; }
  .brand img{
    width:44px; height:44px; border-radius:11px; object-fit:cover;
    box-shadow:0 0 0 1px rgba(47,212,232,0.35), 0 6px 18px rgba(47,212,232,0.18);
    flex-shrink:0;
  }
  .brand-text{ display:flex; flex-direction:column; line-height:1.15; min-width:0; }
  .brand-name{
    font-family:var(--font-display);
    font-weight:700;
    font-size:19px;
    letter-spacing:0.2px;
    background:linear-gradient(90deg,#eaf6ff,var(--accent) 85%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    white-space:nowrap;
  }
  .brand-tag{
    font-size:11.5px;
    color:var(--ink-dim);
    letter-spacing:0.4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .lang-switch{
    display:flex;
    align-items:center;
    gap:2px;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:999px;
    padding:3px;
    flex-shrink:0;
  }
  .lang-switch button{
    border:none;
    background:transparent;
    color:var(--ink-dim);
    font-family:var(--font-ui);
    font-size:13px;
    font-weight:600;
    padding:7px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:background .2s ease, color .2s ease;
  }
  .lang-switch button.active{
    background:linear-gradient(90deg,var(--accent-2),var(--accent));
    color:#04121f;
  }
  .lang-switch button[data-lang-btn="bn"]{ font-family:'Noto Sans Bengali',sans-serif; }

  /* ---------- MAIN / CHAT ---------- */
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    max-width:880px;
    width:100%;
    margin:0 auto;
    padding:0 18px;
    min-height:0;
  }
  #chatWindow{
    flex:1;
    overflow-y:auto;
    padding:26px 4px 10px;
    display:flex;
    flex-direction:column;
    gap:16px;
    scroll-behavior:smooth;
  }
  #chatWindow::-webkit-scrollbar{ width:8px; }
  #chatWindow::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }

  .empty-state{
    margin:auto;
    text-align:center;
    color:var(--ink-dim);
    max-width:420px;
    padding:20px;
  }
  .empty-state img{
    width:64px; height:64px; border-radius:16px; margin-bottom:16px;
    box-shadow:0 0 0 1px rgba(47,212,232,0.3), 0 10px 30px rgba(47,212,232,0.15);
  }
  .empty-state h2{
    font-family:var(--font-display);
    color:var(--ink);
    font-size:20px;
    margin:0 0 8px;
  }
  .empty-state p{ margin:0; font-size:14px; line-height:1.6; }
  .suggestions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-top:18px;
  }
  .suggestions button{
    font-family:inherit;
    font-size:12.5px;
    color:var(--ink);
    background:var(--bg-panel);
    border:1px solid var(--line);
    padding:8px 13px;
    border-radius:999px;
    cursor:pointer;
    transition:border-color .2s ease, transform .15s ease;
  }
  .suggestions button:hover{ border-color:var(--accent); transform:translateY(-1px); }

  .msg-row{ display:flex; gap:10px; align-items:flex-end; }
  .msg-row.user{ justify-content:flex-end; }
  .avatar{
    width:28px; height:28px; border-radius:8px; flex-shrink:0; object-fit:cover;
    box-shadow:0 0 0 1px rgba(47,212,232,0.3);
  }
  .bubble{
    max-width:74%;
    padding:12px 15px;
    border-radius:var(--radius);
    font-size:14.5px;
    line-height:1.6;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .msg-row.ai .bubble{
    background:var(--bubble-ai);
    border:1px solid var(--line);
    border-bottom-left-radius:4px;
  }
  .msg-row.user .bubble{
    background:linear-gradient(135deg,var(--bubble-user),#1c4a80);
    border:1px solid rgba(47,212,232,0.25);
    border-bottom-right-radius:4px;
  }
  .msg-time{
    font-size:10.5px;
    color:var(--ink-dim);
    margin-top:4px;
    padding:0 4px;
  }
  .msg-row.user .msg-time{ text-align:right; }

  .typing{ display:flex; gap:4px; padding:6px 2px; }
  .typing span{
    width:6px; height:6px; border-radius:50%;
    background:var(--accent);
    opacity:0.4;
    animation:blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay:0.2s; }
  .typing span:nth-child(3){ animation-delay:0.4s; }
  @keyframes blink{ 0%,80%,100%{ opacity:0.25; transform:scale(0.85);} 40%{ opacity:1; transform:scale(1);} }

  .error-note{
    font-size:12.5px;
    color:var(--danger);
    background:rgba(255,107,107,0.08);
    border:1px solid rgba(255,107,107,0.3);
    padding:8px 12px;
    border-radius:10px;
  }

  /* ---------- INPUT BAR ---------- */
  .input-bar{
    display:flex;
    align-items:flex-end;
    gap:10px;
    padding:14px 4px 20px;
  }
  .input-shell{
    flex:1;
    display:flex;
    align-items:flex-end;
    gap:8px;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:20px;
    padding:9px 9px 9px 16px;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .input-shell:focus-within{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  #userInput{
    flex:1;
    border:none;
    outline:none;
    resize:none;
    background:transparent;
    color:var(--ink);
    font-family:inherit;
    font-size:14.5px;
    line-height:1.5;
    max-height:140px;
    padding:6px 0;
  }
  #userInput::placeholder{ color:var(--ink-dim); }
  #sendBtn{
    width:38px; height:38px; flex-shrink:0;
    border:none; border-radius:50%;
    background:linear-gradient(135deg,var(--accent-2),var(--accent));
    color:#04121f;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:transform .15s ease, opacity .15s ease;
  }
  #sendBtn:hover:not(:disabled){ transform:scale(1.06); }
  #sendBtn:disabled{ opacity:0.4; cursor:not-allowed; }
  #sendBtn svg{ width:17px; height:17px; }

  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 6px 6px;
  }
  .clear-btn{
    font-family:inherit;
    font-size:12px;
    color:var(--ink-dim);
    background:transparent;
    border:none;
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .clear-btn:hover{ color:var(--ink); }
  .footnote{ font-size:11px; color:var(--ink-dim); }

  @media (max-width:560px){
    .brand-tag{ display:none; }
    .bubble{ max-width:86%; }
    header{ padding:12px 14px; }
  }
</style>
</head>

function setLanguage(lang){

  document.body.setAttribute("data-lang", lang);

  document.querySelectorAll("[data-lang-btn]").forEach(btn=>{
    btn.classList.toggle("active", btn.getAttribute("data-lang-btn") === lang);
  });

  const t = translations[lang];
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.getAttribute("data-i18n");
    if(t[key] !== undefined) el.textContent = t[key];
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el=>{
    const key = el.getAttribute("data-i18n-placeholder");
    if(t[key] !== undefined) el.placeholder = t[key];
  });

  renderSuggestions();
}

function renderSuggestions(){
  const wrap = document.getElementById("suggestions");
  if(!wrap || chatHistory.length > 0) { if(wrap) wrap.innerHTML = ""; return; }
  const t = translations[currentLang];
  wrap.innerHTML = "";
  t.suggestions.forEach(s=>{
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = s;
    b.onclick = ()=>{ document.getElementById("userInput").value = s; sendMessage(); };
    wrap.appendChild(b);
  });
}

function formatTime(){
  const d = new Date();
  return d.toLocaleTimeString(currentLang === "bn" ? "bn-BD" : "en-US", {hour:"2-digit", minute:"2-digit"});
}

async function sendMessage(){
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if(!text) return;

  const sendBtn = document.getElementById("sendBtn");
  sendBtn.disabled = true;
  input.value = "";
  input.style.height = "auto";

  appendMessage("user", text);
  chatHistory.push({role:"user", content: text});
  renderSuggestions();
  appendTyping();

  const langInstruction = currentLang === "bn"
    ? "Always respond in Bengali (Bangla), regardless of what language the user writes in. Keep replies clear and conversational."
    : "Always respond in English, regardless of what language the user writes in. Keep replies clear and conversational.";

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: langInstruction,
        messages: chatHistory
      })
    });

    const data = await response.json();
    removeTyping();

    let replyText = "";
    if(data && data.content){
      replyText = data.content.map(block => block.type === "text" ? block.text : "").join("\n").trim();
    }
    if(!replyText){
      replyText = translations[currentLang].errorMsg;
    }

    appendMessage("ai", replyText);
    chatHistory.push({role:"assistant", content: replyText});

  }catch(err){
    removeTyping();
    appendMessage("ai", translations[currentLang].errorMsg);
    console.error("ABU AI Cloud error:", err);
  }finally{
    sendBtn.disabled = false;
    input.focus();
  }
}

setLanguage("en");
